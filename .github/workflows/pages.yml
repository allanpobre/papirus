# Publica o Papirus no GitHub Pages a cada push na main.
# Antes da primeira vez: Settings → Pages → Source: "GitHub Actions".
# Opcional: em Settings → Secrets and variables → Actions → Variables, crie
#   PAPIRUS_SUPABASE_URL e PAPIRUS_SUPABASE_KEY (anon key) para o Codex ao vivo
#   já vir configurado e os links dos jogadores ficarem curtos.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx vite build --base=./
        env:
          VITE_PAPIRUS_SUPABASE_URL: ${{ vars.PAPIRUS_SUPABASE_URL }}
          VITE_PAPIRUS_SUPABASE_KEY: ${{ vars.PAPIRUS_SUPABASE_KEY }}
          VITE_PAPIRUS_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
