<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9ece7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101413" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papirus — escreva e mestre o seu mundo</title>
    <meta name="description" content="Caderno de mundo para quem escreve histórias e para quem mestra RPG: fichas, linha do tempo, mapas, segredos e o Codex ao vivo para os jogadores. Grátis, sem cadastro, funciona no navegador." />
    <meta property="og:title" content="Papirus" />
    <meta property="og:description" content="Seu mundo, escrito e jogado no mesmo caderno." />
    <meta property="og:type" content="website" />
    <script>
      // Links antigos de jogadores (?mesa=) e retornos de login por e-mail (#access_token) vão para o app.
      ;(function () {
        var s = location.search, h = location.hash
        if (/[?&](mesa|ler)=/.test(s) || /access_token=|error_description=|type=(signup|recovery|magiclink)/.test(h)) location.replace('app/' + s + h)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
